<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- SEO Meta Tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Discover the latest fashion products with fast delivery. Shop clothing, electronics, home & kitchen, and more at the best prices." />
    <meta name="keywords" content="fashion, clothing, electronics, shopping, online store, deals" />
    <meta name="author" content="Shop Fashion" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0f1115" />
    
    <!-- Open Graph Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Shop Fashion - Discover Latest Trends & Deals" />
    <meta property="og:description" content="Discover the latest fashion products with fast delivery. Shop clothing, electronics, home & kitchen, and more at the best prices." />
    <meta property="og:url" content="https://shop.example.com" />
    <meta property="og:image" content="https://shop.example.com/og-image.jpg" />
    <meta property="og:site_name" content="Shop Fashion" />
    <meta property="og:locale" content="en_US" />
    
    <!-- Twitter Card Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Shop Fashion - Discover Latest Trends & Deals" />
    <meta name="twitter:description" content="Discover the latest fashion products with fast delivery." />
    <meta name="twitter:image" content="https://shop.example.com/twitter-image.jpg" />
    <meta name="twitter:site" content="@shopfashion" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://shop.example.com/" />
    
    <!-- Favicon and Web App Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Title -->
    <title>Shop Fashion - Discover Latest Trends & Deals</title>

    <!--
      STAGE 1 — Network optimisation:
      preconnect tells the browser to open the TCP/TLS handshake to the API
      origin immediately, so the first API call after React mounts has zero
      connection latency. dns-prefetch is a lighter fallback for browsers
      that don't support preconnect.

      Only the backend API origin is listed here — no unnecessary third-party
      connections.
    -->
    <link rel="preconnect" href="https://ecommerce-backend-springboot-production.up.railway.app" crossorigin />
    <link rel="dns-prefetch" href="https://ecommerce-backend-springboot-production.up.railway.app" />

    <!--
      LCP fix: in a client-rendered SPA, the hero <img> doesn't exist in the
      DOM until React mounts, so the browser's preload scanner can't discover
      it while the JS bundle is still downloading/parsing. These preload the
      actual first-slide image (index 0 in heroSlides.js / HeroBanner.jsx) in
      parallel with the JS, instead of only starting after React renders it.
      Media-gated on the same 768px breakpoint the components use (Tailwind
      `md:`) so only one of the two is ever fetched.
    -->
    <link rel="preload" as="image" href="/images/fashion-hero-promo-mobile.webp" type="image/webp" media="(max-width: 767px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/images/fashion-hero-promo.webp" type="image/webp" media="(min-width: 768px)" fetchpriority="high" />

    <!--
      CRITICAL: Inline theme script — executes synchronously during HTML
      parsing, BEFORE any external CSS or JS loads. This is the earliest
      possible point to read the persisted theme and apply it, which is
      the only reliable fix for the white-flash-on-refresh problem.

      Why inline and not deferred?
      A deferred/module script runs AFTER the browser has already painted
      the initial frame (which would be white). An inline script runs
      synchronously mid-parse and blocks painting until it finishes —
      exactly what we want here (it's <1ms, so no perceptible delay).
    -->
    <script>
      (function () {
        var STORAGE_KEY = 'theme-preference';
        var DEFAULT_BG_LIGHT = '#f4f6f8';
        var DEFAULT_BG_DARK  = '#0f1115';

        // Dark is the default for first-time visitors (no stored preference
        // yet) — intentionally not tied to prefers-color-scheme. A stored
        // preference (light or dark, set via the toggle) always wins.
        var theme = 'dark';
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            var parsed = JSON.parse(raw);
            theme = (parsed && parsed.state && parsed.state.theme) || 'dark';
          }
        } catch (e) { /* ignore */ }

        var bg = theme === 'dark' ? DEFAULT_BG_DARK : DEFAULT_BG_LIGHT;
        var fg = theme === 'dark' ? '#f5f7fa' : '#0f0f11';

        // Apply data-theme so CSS variables resolve correctly from first paint
        document.documentElement.setAttribute('data-theme', theme);

        // Paint the background immediately — prevents white flash on refresh
        document.documentElement.style.backgroundColor = bg;
        document.documentElement.style.color = fg;
        document.body && (document.body.style.backgroundColor = bg);

        // Update theme-color meta for browser chrome
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', bg);
      })();
    </script>

    <!--
      Inline critical CSS: ensures html/body/#root always carry the correct
      background even during the gap between HTML-parse and CSS-load.
      These rules use the same variable names as theme.css so once the
      stylesheet loads they are seamlessly overridden by the full tokens.
    -->
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background-color: var(--bg-primary, #f4f6f8);
        color: var(--text-primary, #0f0f11);
      }
      /* Dark mode — applied before any stylesheet loads */
      html[data-theme="dark"],
      html[data-theme="dark"] body,
      html[data-theme="dark"] #root {
        background-color: #0f1115;
        color: #f5f7fa;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
